receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  # The app emits gen_ai.* natively (TraceConfig(enable_genai_semconv=True)).
  # The conversion sets gen_ai.response.model only when the output payload has a
  # "model" key. The AI Observability app requires it, so mirror the request
  # model when unset.
  transform/response_model:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(attributes["gen_ai.response.model"], attributes["gen_ai.request.model"]) where attributes["gen_ai.request.model"] != nil and attributes["gen_ai.response.model"] == nil

  # Extracts Azure OpenAI content-filter results embedded in the output.value
  # JSON blob.
  #
  # Azure OpenAI wraps the model response and content-filter metadata together in
  # output.value. Two sets of filter results are promoted to dedicated attributes:
  #   - llm_output.prompt_filter_results: per-prompt verdicts from Azure content
  #     filtering (hate, self-harm, sexual, violence, jailbreak, etc.)
  #   - generations[0][0].generation_info.content_filter_results: per-completion
  #     content filter verdicts returned alongside the generated text
  #
  # INPUT  (OpenInference / Azure OpenAI via LangChain):
  #   output.value  (JSON string)
  #     ├── llm_output.prompt_filter_results
  #     └── generations[0][0].generation_info.content_filter_results
  #
  # OUTPUT:
  #   gen_ai.prompt.prompt_filter_results      — serialised prompt-filter array
  #   gen_ai.completion.content_filter_results — serialised completion-filter object
  transform/output_prompt_results:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(attributes["temp.output_value"], ParseJSON(attributes["output.value"])) where attributes["output.value"] != nil
          - set(attributes["gen_ai.prompt.prompt_filter_results"], String(attributes["temp.output_value"]["llm_output"]["prompt_filter_results"])) where attributes["temp.output_value"]["llm_output"]["prompt_filter_results"] != nil
          - set(attributes["gen_ai.completion.content_filter_results"], String(attributes["temp.output_value"]["generations"][0][0]["generation_info"]["content_filter_results"])) where attributes["temp.output_value"]["generations"][0][0]["generation_info"]["content_filter_results"] != nil
          - delete_key(attributes, "temp.output_value")

  # OpenInference sends the system prompt only as the first role=system entry of
  # gen_ai.input.messages. Copy its parts to gen_ai.system_instructions.
  transform/system_instructions:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(cache["messages"], ParseJSON(attributes["gen_ai.input.messages"])) where attributes["gen_ai.input.messages"] != nil and attributes["gen_ai.system_instructions"] == nil
          - set(attributes["gen_ai.system_instructions"], String(cache["messages"][0]["parts"])) where cache["messages"] != nil and cache["messages"][0]["role"] == "system"

  # Keep only spans that represent an LLM call (the conversion sets
  # gen_ai.request.model on LLM spans only). Feeds the metrics connectors so the derived metrics
  # cover LLM calls only, not chain/tool/agent spans. Used solely on the metrics
  # branch; the export pipeline is left untouched so all spans still reach
  # Distributed Tracing.
  filter/genai_only:
    error_mode: ignore
    traces:
      span:
        - attributes["gen_ai.request.model"] == nil

connectors:
  # Duration: derive gen_ai.client.operation.duration (OTel GenAI semconv, seconds)
  # from the LLM span durations. namespace + the connector's "duration" histogram
  # => gen_ai.client.operation.duration.
  span_metrics:
    namespace: gen_ai.client.operation
    # Dynatrace OTLP metric ingest accepts delta temporality only; cumulative is dropped.
    aggregation_temporality: AGGREGATION_TEMPORALITY_DELTA
    histogram:
      unit: s
      explicit:
        buckets: [100ms, 250ms, 500ms, 1s, 2s, 5s, 10s, 30s, 60s]
    dimensions:
      - name: gen_ai.request.model
      - name: gen_ai.response.model
      - name: gen_ai.provider.name
      - name: gen_ai.operation.name
    metrics_flush_interval: 15s

  # Token usage: OpenInference is span-only (no metric instruments), so the token
  # counts live only as span attributes. Re-create gen_ai.client.token.usage from
  # them with two sum defs sharing one metric name; the gen_ai.token.type dimension
  # is synthesized per direction via default_value (the span carries no such
  # attribute). signal_to_metrics emits delta per batch, which Dynatrace requires.
  signal_to_metrics:
    spans:
      - name: gen_ai.client.token.usage
        description: "Number of tokens used per LLM call, by direction"
        unit: "{token}"
        conditions:
          - attributes["gen_ai.usage.input_tokens"] != nil
        sum:
          value: Int(attributes["gen_ai.usage.input_tokens"])
          monotonic: true
        attributes:
          - key: gen_ai.token.type
            default_value: input
          - key: gen_ai.request.model
          - key: gen_ai.response.model
          - key: gen_ai.provider.name
          - key: gen_ai.operation.name
      - name: gen_ai.client.token.usage
        description: "Number of tokens used per LLM call, by direction"
        unit: "{token}"
        conditions:
          - attributes["gen_ai.usage.output_tokens"] != nil
        sum:
          value: Int(attributes["gen_ai.usage.output_tokens"])
          monotonic: true
        attributes:
          - key: gen_ai.token.type
            default_value: output
          - key: gen_ai.request.model
          - key: gen_ai.response.model
          - key: gen_ai.provider.name
          - key: gen_ai.operation.name
      # service.name is a resource attribute included by default — no
      # include_resource_attributes filter needed, same as span_metrics.

exporters:
  debug:
    verbosity: detailed
  otlp_http/dynatrace:
    endpoint: ${env:DT_ENDPOINT}/api/v2/otlp
    headers:
      Authorization: "Api-Token ${env:DT_API_TOKEN}"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/output_prompt_results, transform/response_model, transform/system_instructions]
      exporters: [debug, otlp_http/dynatrace]
    # Second branch of the same spans: keep only LLM spans, and feed
    # the metric connectors. Kept separate from the export pipeline so the filter
    # here never drops spans from Distributed Tracing.
    traces/genai_metrics:
      receivers: [otlp]
      processors: [transform/response_model, filter/genai_only]
      exporters: [span_metrics, signal_to_metrics]
    metrics:
      receivers: [span_metrics, signal_to_metrics]
      exporters: [otlp_http/dynatrace]
