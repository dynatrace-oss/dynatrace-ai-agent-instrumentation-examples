[project]
name = "litellm-opentelemetry-demo"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "litellm[proxy]>=1.95.0",
    # litellm.proxy imports fastapi.dependencies.utils.get_flat_dependant, which
    # FastAPI removed in 0.140.7 — cap below it until litellm drops that import.
    "fastapi>=0.140.0,<0.140.7",
    "uvicorn>=0.50.0",
    "traceloop-sdk==0.62.3",
    "opentelemetry-sdk>=1.43.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.43.0",
    "opentelemetry-instrumentation-fastapi>=0.63b0",
    "opentelemetry-instrumentation-httpx>=0.63b0",
    "pydantic>=2.0.0",
]
