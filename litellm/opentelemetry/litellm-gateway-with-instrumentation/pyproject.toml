[project]
name = "litellm-gateway-openinference-demo"
version = "0.2.0"
description = "LiteLLM proxy with OpenInference and OTel GenAI semantic conventions"
requires-python = ">=3.10,<3.15"
dependencies = [
  "litellm[proxy]==1.106.6",
  # litellm.proxy imports get_flat_dependant, removed in FastAPI 0.140.7.
  "fastapi==0.140.6",
  "openinference-instrumentation-litellm==0.1.51",
  "opentelemetry-sdk==1.45.1",
  "opentelemetry-exporter-otlp-proto-http==1.45.1",
  "opentelemetry-instrumentation-fastapi==0.66b1",
  "opentelemetry-instrumentation-httpx==0.66b1",
]
