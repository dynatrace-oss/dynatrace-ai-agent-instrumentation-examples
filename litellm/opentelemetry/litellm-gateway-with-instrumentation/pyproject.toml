[project]
name = "litellm-gateway-openinference-demo"
version = "0.2.0"
description = "LiteLLM proxy with OpenInference and OTel GenAI semantic conventions"
requires-python = ">=3.10,<3.15"
dependencies = [
  "litellm[proxy]==1.95.0",
  # litellm.proxy imports get_flat_dependant, removed in FastAPI 0.140.7.
  "fastapi>=0.140.0,<0.140.7",
  "openinference-instrumentation-litellm==0.1.48",
  "opentelemetry-sdk==1.44.0",
  "opentelemetry-exporter-otlp-proto-http==1.44.0",
  "opentelemetry-instrumentation-fastapi==0.65b0",
  "opentelemetry-instrumentation-httpx==0.65b0",
]
