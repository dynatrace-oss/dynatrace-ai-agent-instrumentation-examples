receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  transform/invocation_parameters:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(cache["invocation_parameters"], ParseJSON(attributes["llm.invocation_parameters"])) where attributes["llm.invocation_parameters"] != nil
          - set(attributes["gen_ai.request.temperature"], cache["invocation_parameters"]["temperature"]) where attributes["gen_ai.request.temperature"] == nil and cache["invocation_parameters"]["temperature"] != nil
          - set(attributes["gen_ai.request.top_p"], cache["invocation_parameters"]["top_p"]) where attributes["gen_ai.request.top_p"] == nil and cache["invocation_parameters"]["top_p"] != nil
          - set(attributes["gen_ai.request.max_tokens"], cache["invocation_parameters"]["max_tokens"]) where attributes["gen_ai.request.max_tokens"] == nil and cache["invocation_parameters"]["max_tokens"] != nil

  genainormalizer:
    source: openinference
    remove_originals: true

  transform/genai_fallbacks:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(attributes["gen_ai.response.model"], attributes["gen_ai.request.model"]) where attributes["gen_ai.response.model"] == nil and attributes["gen_ai.request.model"] != nil
          - set(attributes["gen_ai.provider.name"], "ollama") where attributes["gen_ai.provider.name"] == nil and attributes["gen_ai.request.model"] != nil and IsMatch(attributes["gen_ai.request.model"], "^ollama/")

  transform/remove_legacy:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - delete_matching_keys(attributes, "^(llm|openinference)\\.")

  batch: {}

exporters:
  otlphttp/dynatrace:
    endpoint: ${env:DT_ENDPOINT}/api/v2/otlp
    headers:
      Authorization: "Api-Token ${env:DT_API_TOKEN}"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors:
        - transform/invocation_parameters
        - genainormalizer
        - transform/genai_fallbacks
        - transform/remove_legacy
        - batch
      exporters: [otlphttp/dynatrace]
