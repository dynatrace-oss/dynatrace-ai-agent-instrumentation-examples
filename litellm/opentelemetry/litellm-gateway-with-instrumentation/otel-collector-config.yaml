receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  transform/genai_gaps:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          # Parse invocation parameters before removing legacy attributes.
          - set(cache["params"], ParseJSON(attributes["llm.invocation_parameters"])) where attributes["llm.invocation_parameters"] != nil

          # Fill request parameters only when native gen_ai.* emission omitted them.
          - set(attributes["gen_ai.request.temperature"], cache["params"]["temperature"]) where attributes["gen_ai.request.temperature"] == nil and cache["params"] != nil and cache["params"]["temperature"] != nil
          - set(attributes["gen_ai.request.top_p"], cache["params"]["top_p"]) where attributes["gen_ai.request.top_p"] == nil and cache["params"] != nil and cache["params"]["top_p"] != nil
          - set(attributes["gen_ai.request.max_tokens"], cache["params"]["max_tokens"]) where attributes["gen_ai.request.max_tokens"] == nil and cache["params"] != nil and cache["params"]["max_tokens"] != nil

          # Model fallbacks.
          - set(attributes["gen_ai.request.model"], attributes["llm.model_name"]) where attributes["gen_ai.request.model"] == nil and attributes["llm.model_name"] != nil
          - set(attributes["gen_ai.response.model"], attributes["gen_ai.request.model"]) where attributes["gen_ai.response.model"] == nil and attributes["gen_ai.request.model"] != nil

          # Provider fallbacks.
          - set(attributes["gen_ai.provider.name"], attributes["llm.provider"]) where attributes["gen_ai.provider.name"] == nil and attributes["llm.provider"] != nil
          - set(attributes["gen_ai.provider.name"], attributes["llm.system"]) where attributes["gen_ai.provider.name"] == nil and attributes["llm.system"] != nil
          - set(attributes["gen_ai.provider.name"], "ollama") where attributes["gen_ai.provider.name"] == nil and attributes["gen_ai.request.model"] != nil and IsMatch(attributes["gen_ai.request.model"], "^ollama/")

          # Token-usage fallbacks.
          - set(attributes["gen_ai.usage.input_tokens"], attributes["llm.token_count.prompt"]) where attributes["gen_ai.usage.input_tokens"] == nil and attributes["llm.token_count.prompt"] != nil
          - set(attributes["gen_ai.usage.output_tokens"], attributes["llm.token_count.completion"]) where attributes["gen_ai.usage.output_tokens"] == nil and attributes["llm.token_count.completion"] != nil

          # Operation fallbacks.
          - set(attributes["gen_ai.operation.name"], "chat") where attributes["gen_ai.operation.name"] == nil and attributes["openinference.span.kind"] == "LLM"
          - set(attributes["gen_ai.operation.name"], "embeddings") where attributes["gen_ai.operation.name"] == nil and attributes["openinference.span.kind"] == "EMBEDDING"

  # Run this last, after all fallback mappings.
  transform/remove_legacy:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - 'delete_matching_keys(attributes, "^(llm|openinference)\\.")'

  batch: {}

exporters:
  otlphttp/dynatrace:
    endpoint: ${env:DT_ENDPOINT}/api/v2/otlp
    headers:
      Authorization: "Api-Token ${env:DT_API_TOKEN}"

service:
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - transform/genai_gaps
        - transform/remove_legacy
        - batch
      exporters:
        - otlphttp/dynatrace