model_list:
  - model_name: ollama-llama3.2
    litellm_params:
      model: ollama/llama3.2
      api_base: os.environ/OLLAMA_BASE_URL
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: rag-embeddings
    litellm_params:
      model: ollama/all-minilm
      api_base: os.environ/OLLAMA_BASE_URL
  # Pass any other model (e.g. azure/<deployment>, gpt-*) straight to its provider,
  # using the provider credentials from the environment.
  - model_name: "*"
    litellm_params:
      model: "*"

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  ui_username: os.environ/LITELLM_UI_USERNAME
  ui_password: os.environ/LITELLM_UI_PASSWORD
  store_model_in_db: false

litellm_settings:
  drop_params: true
  # Do not enable LiteLLM "otel" callbacks here. OpenInference owns LLM spans.
