receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  # OPENINFERENCE_ENABLE_GENAI_SEMCONV currently maps request parameters from
  # top-level llm.invocation_parameters keys. Ollama sends temperature under
  # invocation_parameters.options.temperature, so patch it in here only when the
  # native gen_ai.request.temperature is missing.
  transform/ollama_temperature:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(attributes["temp.invocation_params"], ParseJSON(attributes["llm.invocation_parameters"])) where attributes["llm.invocation_parameters"] != nil and attributes["gen_ai.request.temperature"] == nil
          - set(attributes["gen_ai.request.temperature"], attributes["temp.invocation_params"]["options"]["temperature"]) where attributes["gen_ai.request.temperature"] == nil and attributes["temp.invocation_params"]["options"]["temperature"] != nil
          - delete_key(attributes, "temp.invocation_params") where attributes["temp.invocation_params"] != nil

  # OPENINFERENCE_ENABLE_GENAI_SEMCONV=true (set in main.py) makes
  # OllamaInstrumentor emit gen_ai.* attributes on the span natively, so no
  # attribute normalization runs here.
  # Keep only spans that represent an LLM call (gen_ai.request.model is set
  # natively on LLM spans). Feeds the metrics connectors so the derived metrics
  # cover LLM calls only. Used solely on the metrics branch — the export
  # pipeline is left untouched so all spans still reach Distributed Tracing.
  filter/genai_only:
    error_mode: ignore
    traces:
      span:
        - attributes["gen_ai.request.model"] == nil

connectors:
  # Duration: derive gen_ai.client.operation.duration (OTel GenAI semconv,
  # seconds) from the LLM span durations. OpenInference emits no metric
  # instruments of its own (span-only by design), so this is still needed
  # regardless of native gen_ai.* naming.
  span_metrics:
    namespace: gen_ai.client.operation
    # Dynatrace OTLP metric ingest accepts delta temporality only; cumulative is dropped.
    aggregation_temporality: AGGREGATION_TEMPORALITY_DELTA
    histogram:
      unit: s
      explicit:
        buckets: [100ms, 250ms, 500ms, 1s, 2s, 5s, 10s, 30s, 60s]
    dimensions:
      - name: gen_ai.request.model
      - name: gen_ai.response.model
      - name: gen_ai.provider.name
      - name: gen_ai.operation.name
    metrics_flush_interval: 15s

  # Token usage: OpenInference has no metric instrument for token counts, so
  # re-create gen_ai.client.token.usage from the (natively named) span
  # attributes with two sum defs sharing one metric name; the gen_ai.token.type
  # dimension is synthesized per direction via default_value. signal_to_metrics
  # emits delta per batch, which Dynatrace requires.
  signal_to_metrics:
    spans:
      - name: gen_ai.client.token.usage
        description: "Number of tokens used per LLM call, by direction"
        unit: "{token}"
        conditions:
          - attributes["gen_ai.usage.input_tokens"] != nil
        sum:
          value: Int(attributes["gen_ai.usage.input_tokens"])
          monotonic: true
        attributes:
          - key: gen_ai.token.type
            default_value: input
          - key: gen_ai.request.model
          - key: gen_ai.response.model
          - key: gen_ai.provider.name
          - key: gen_ai.operation.name
      - name: gen_ai.client.token.usage
        description: "Number of tokens used per LLM call, by direction"
        unit: "{token}"
        conditions:
          - attributes["gen_ai.usage.output_tokens"] != nil
        sum:
          value: Int(attributes["gen_ai.usage.output_tokens"])
          monotonic: true
        attributes:
          - key: gen_ai.token.type
            default_value: output
          - key: gen_ai.request.model
          - key: gen_ai.response.model
          - key: gen_ai.provider.name
          - key: gen_ai.operation.name
      # service.name is a resource attribute included by default — no
      # include_resource_attributes filter needed, same as span_metrics.

exporters:
  otlp_http/dynatrace:
    endpoint: "${env:DT_ENDPOINT}/api/v2/otlp"
    headers:
      Authorization: "Api-Token ${env:DT_API_TOKEN}"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/ollama_temperature]
      exporters: [otlp_http/dynatrace]
    # Second branch of the same spans: keep only LLM spans and feed the metric
    # connectors. Kept separate from the export pipeline so the filter here
    # never drops spans from Distributed Tracing.
    traces/genai_metrics:
      receivers: [otlp]
      processors: [transform/ollama_temperature, filter/genai_only]
      exporters: [span_metrics, signal_to_metrics]
    metrics:
      receivers: [otlp, span_metrics, signal_to_metrics]
      exporters: [otlp_http/dynatrace]
    logs:
      receivers: [otlp]
      exporters: [otlp_http/dynatrace]
