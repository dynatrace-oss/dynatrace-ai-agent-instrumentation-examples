receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Reads llm.invocation_parameters before gen_ai_normalizer deletes it below.
  # OllamaInstrumentor nests temperature/num_predict/top_p under an "options"
  # object (the ollama Python client's chat(options={...}) kwarg) rather than
  # as flat invocation_parameters keys like the other provider SDKs in this
  # repo, so the JSON path here goes one level deeper than e.g.
  # cohere/openinference or anthropic/openinference use.
  transform/pre_normalize:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(attributes["temp.invocation_params"], ParseJSON(attributes["llm.invocation_parameters"])) where attributes["llm.invocation_parameters"] != nil
          - set(attributes["gen_ai.request.temperature"], attributes["temp.invocation_params"]["options"]["temperature"]) where attributes["temp.invocation_params"]["options"]["temperature"] != nil
          - set(attributes["gen_ai.request.max_tokens"], attributes["temp.invocation_params"]["options"]["num_predict"]) where attributes["temp.invocation_params"]["options"]["num_predict"] != nil
          - set(attributes["gen_ai.request.top_p"], attributes["temp.invocation_params"]["options"]["top_p"]) where attributes["temp.invocation_params"]["options"]["top_p"] != nil
          - delete_key(attributes, "temp.invocation_params") where attributes["temp.invocation_params"] != nil

  # Normalize OpenInference attributes to the OTel gen_ai.* semantic conventions.
  # The built-in "openinference" source maps model, provider, token usage, tool
  # and session attributes, and reconstructs llm.output_messages.0.* into
  # gen_ai.output.messages — OllamaInstrumentor emits a flat single-message
  # response (no Anthropic-style content-block nesting), so no extra fixup
  # transform is needed here. remove_originals drops the raw llm.* attributes
  # so the exported spans carry only gen_ai.* fields.
  gen_ai_normalizer:
    sources:
      - name: openinference
        remove_originals: true

  # gen_ai_normalizer maps llm.model_name -> gen_ai.request.model but does not
  # emit gen_ai.response.model (OpenInference has no separate response-model
  # field). The Dynatrace AI Observability app requires gen_ai.response.model,
  # so mirror the request model when the response has not set one.
  transform/response_model:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(attributes["gen_ai.response.model"], attributes["gen_ai.request.model"]) where attributes["gen_ai.request.model"] != nil and attributes["gen_ai.response.model"] == nil

  batch:
    send_batch_size: 512
    timeout: 5s

  # Keep only spans that represent an LLM call (gen_ai.request.model is set by the
  # normalizer on LLM spans). Feeds the metrics connectors so the derived metrics
  # cover LLM calls only. Used solely on the metrics branch — the export pipeline
  # is left untouched so all spans still reach Distributed Tracing.
  filter/genai_only:
    error_mode: ignore
    traces:
      span:
        - attributes["gen_ai.request.model"] == nil

connectors:
  # Duration: derive gen_ai.client.operation.duration (OTel GenAI semconv, seconds)
  # from the LLM span durations — same connector the langfuse demo uses.
  span_metrics:
    namespace: gen_ai.client.operation
    # Dynatrace OTLP metric ingest accepts delta temporality only; cumulative is dropped.
    aggregation_temporality: AGGREGATION_TEMPORALITY_DELTA
    histogram:
      unit: s
      explicit:
        buckets: [100ms, 250ms, 500ms, 1s, 2s, 5s, 10s, 30s, 60s]
    dimensions:
      - name: gen_ai.request.model
      - name: gen_ai.response.model
      - name: gen_ai.provider.name
      - name: gen_ai.operation.name
    metrics_flush_interval: 15s

  # Token usage: OpenInference is span-only (no metric instruments). Re-create
  # gen_ai.client.token.usage from the span token attributes with two sum defs
  # sharing one metric name; the gen_ai.token.type dimension is synthesized per
  # direction via default_value. signal_to_metrics emits delta per batch, which
  # Dynatrace requires. Collector-path equivalent of the OpenPipeline
  # two-extractor pattern.
  signal_to_metrics:
    spans:
      - name: gen_ai.client.token.usage
        description: "Number of tokens used per LLM call, by direction"
        unit: "{token}"
        conditions:
          - attributes["gen_ai.usage.input_tokens"] != nil
        sum:
          value: Int(attributes["gen_ai.usage.input_tokens"])
          monotonic: true
        attributes:
          - key: gen_ai.token.type
            default_value: input
          - key: gen_ai.request.model
          - key: gen_ai.response.model
          - key: gen_ai.provider.name
          - key: gen_ai.operation.name
      - name: gen_ai.client.token.usage
        description: "Number of tokens used per LLM call, by direction"
        unit: "{token}"
        conditions:
          - attributes["gen_ai.usage.output_tokens"] != nil
        sum:
          value: Int(attributes["gen_ai.usage.output_tokens"])
          monotonic: true
        attributes:
          - key: gen_ai.token.type
            default_value: output
          - key: gen_ai.request.model
          - key: gen_ai.response.model
          - key: gen_ai.provider.name
          - key: gen_ai.operation.name
      # service.name is a resource attribute included by default — no
      # include_resource_attributes filter needed, same as span_metrics.

exporters:
  otlp_http/dynatrace:
    endpoint: "${env:DT_ENDPOINT}/api/v2/otlp"
    headers:
      Authorization: "Api-Token ${env:DT_API_TOKEN}"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/pre_normalize, gen_ai_normalizer, transform/response_model, batch]
      exporters: [otlp_http/dynatrace]
    # Second branch of the same spans: normalize, keep only LLM spans, and feed
    # the metric connectors. Kept separate from the export pipeline so the filter
    # here never drops spans from Distributed Tracing.
    traces/genai_metrics:
      receivers: [otlp]
      processors: [transform/pre_normalize, gen_ai_normalizer, transform/response_model, filter/genai_only, batch]
      exporters: [span_metrics, signal_to_metrics]
    metrics:
      receivers: [otlp, span_metrics, signal_to_metrics]
      exporters: [otlp_http/dynatrace]
    logs:
      receivers: [otlp]
      exporters: [otlp_http/dynatrace]
