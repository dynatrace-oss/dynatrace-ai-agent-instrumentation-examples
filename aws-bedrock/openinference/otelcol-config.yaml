receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # OpenInference's native gen_ai.* emission has no field for the response
  # model (Bedrock's Converse response carries no model id), so mirror the
  # request model the same way the removed normalizer chain used to.
  transform/response_model:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(attributes["gen_ai.response.model"], attributes["gen_ai.request.model"]) where attributes["gen_ai.request.model"] != nil and attributes["gen_ai.response.model"] == nil

  # OpenInference's native gen_ai.* emission has no GUARDRAIL branch, so the
  # standalone ApplyGuardrail span never gets a gen_ai.operation.name. Derive
  # it from the openinference.span.kind attribute, which OpenInference still
  # emits alongside its native gen_ai.* attributes.
  transform/guardrail_operation_name:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(attributes["gen_ai.operation.name"], "GUARDRAIL") where attributes["openinference.span.kind"] == "GUARDRAIL"

  batch:
    send_batch_size: 512
    timeout: 5s

  # Keep only LLM call spans for metric derivation.
  filter/genai_only:
    error_mode: ignore
    traces:
      span:
        - attributes["gen_ai.request.model"] == nil

connectors:
  # Duration: derive gen_ai.client.operation.duration from LLM span durations.
  span_metrics:
    namespace: gen_ai.client.operation
    aggregation_temporality: AGGREGATION_TEMPORALITY_DELTA
    histogram:
      unit: s
      explicit:
        buckets: [100ms, 250ms, 500ms, 1s, 2s, 5s, 10s, 30s, 60s]
    dimensions:
      - name: gen_ai.request.model
      - name: gen_ai.response.model
      - name: gen_ai.provider.name
      - name: gen_ai.operation.name
    metrics_flush_interval: 15s

  # Token usage: OpenInference is span-only, so derive metric points from
  # gen_ai.usage.* span attributes.
  signal_to_metrics:
    spans:
      - name: gen_ai.client.token.usage
        description: "Number of tokens used per LLM call, by direction"
        unit: "{token}"
        conditions:
          - attributes["gen_ai.usage.input_tokens"] != nil
        sum:
          value: Int(attributes["gen_ai.usage.input_tokens"])
          monotonic: true
        attributes:
          - key: gen_ai.token.type
            default_value: input
          - key: gen_ai.request.model
          - key: gen_ai.response.model
          - key: gen_ai.provider.name
          - key: gen_ai.operation.name
      - name: gen_ai.client.token.usage
        description: "Number of tokens used per LLM call, by direction"
        unit: "{token}"
        conditions:
          - attributes["gen_ai.usage.output_tokens"] != nil
        sum:
          value: Int(attributes["gen_ai.usage.output_tokens"])
          monotonic: true
        attributes:
          - key: gen_ai.token.type
            default_value: output
          - key: gen_ai.request.model
          - key: gen_ai.response.model
          - key: gen_ai.provider.name
          - key: gen_ai.operation.name

exporters:
  otlp_http/dynatrace:
    endpoint: "${env:DT_ENDPOINT}/api/v2/otlp"
    headers:
      Authorization: "Api-Token ${env:DT_API_TOKEN}"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/response_model, transform/guardrail_operation_name, batch]
      exporters: [otlp_http/dynatrace]
    traces/genai_metrics:
      receivers: [otlp]
      processors: [transform/response_model, transform/guardrail_operation_name, filter/genai_only, batch]
      exporters: [span_metrics, signal_to_metrics]
    metrics:
      receivers: [otlp, span_metrics, signal_to_metrics]
      exporters: [otlp_http/dynatrace]
    logs:
      receivers: [otlp]
      exporters: [otlp_http/dynatrace]
