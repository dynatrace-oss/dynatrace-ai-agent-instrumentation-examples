[project]
name = "google-adk-zero-code-demo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.0.0",
    "opentelemetry-distro>=0.50b0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0",
    # Emits the SERVER span at the HTTP entry point. ADK's own spans are all
    # span.kind=internal, so without this no service is detected in SDv2.
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]
