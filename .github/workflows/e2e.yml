name: Nightly E2E Tests

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC daily
  workflow_dispatch:
    inputs:
      suite:
        description: 'Run only this suite by name (e.g. openai-oneagent, litellm-opentelemetry). Leave blank to run all.'
        required: false
        type: string
  pull_request:

permissions:
  contents: read

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      oneagent-matrix: ${{ steps.compute.outputs.oneagent-matrix }}
      otelcol-matrix: ${{ steps.compute.outputs.otelcol-matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Compute matrices
        id: compute
        env:
          EVENT: ${{ github.event_name }}
          SUITE_INPUT: ${{ inputs.suite }}
          BASE_REF: ${{ github.base_ref }}
        run: bash .github/scripts/compute-e2e-matrix.sh

  oneagent:
    name: E2E / ${{ matrix.name }}
    needs: filter
    if: (github.event_name == 'pull_request' || inputs.suite != '') && needs.filter.outputs.oneagent-matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.filter.outputs.oneagent-matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: test/e2e/go.mod
          cache: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install uv
        run: pip install -r test/e2e/requirements-tools.txt
      - name: Cache Ollama model
        if: matrix.ollama_model != ''
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.ollama/models
          key: ollama-${{ matrix.ollama_model }}
      - name: Set up Ollama
        if: matrix.ollama_model != ''
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          timeout 30 bash -c 'until curl -sf http://localhost:11434/api/tags > /dev/null; do sleep 1; done'
          ollama pull ${{ matrix.ollama_model }}
      - name: Resolve OneAgent installer version
        id: oneagent-version
        env:
          DT_ENDPOINT: ${{ secrets.DT_ENDPOINT }}
          DT_INSTALLER_TOKEN: ${{ secrets.DT_INSTALLER_TOKEN }}
        run: |
          set -euo pipefail
          case "${DT_ENDPOINT}" in
            https://*) ;;
            *) echo "Error: DT_ENDPOINT must start with https://"; exit 1 ;;
          esac
          VERSION=$(curl -sS --fail \
            --header "Authorization: Api-Token ${DT_INSTALLER_TOKEN}" \
            "${DT_ENDPOINT}/api/v1/deployment/installer/agent/unix/default/latest/metainfo?arch=x86" \
            | jq -r '.latestAgentVersion')
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Error: could not resolve latest OneAgent version from metainfo endpoint"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Cache OneAgent installer
        id: oneagent-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/oneagent/oneagent.sh
          key: oneagent-installer-${{ steps.oneagent-version.outputs.version }}-x86
      - name: Download Dynatrace OneAgent installer
        if: steps.oneagent-cache.outputs.cache-hit != 'true'
        env:
          DT_ENDPOINT: ${{ secrets.DT_ENDPOINT }}
          DT_INSTALLER_TOKEN: ${{ secrets.DT_INSTALLER_TOKEN }}
          VERSION: ${{ steps.oneagent-version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/oneagent
          wget --timeout=60 -O ~/.cache/oneagent/oneagent.sh \
            "${DT_ENDPOINT}/api/v1/deployment/installer/agent/unix/default/version/${VERSION}?arch=x86" \
            --header "Authorization: Api-Token ${DT_INSTALLER_TOKEN}"
      - name: Install Dynatrace OneAgent
        run: sudo sh ~/.cache/oneagent/oneagent.sh
      - name: Wait for OneAgent to settle
        if: matrix.oneagent_warmup_seconds != ''
        run: sleep ${{ matrix.oneagent_warmup_seconds }}
      - name: Run e2e test
        working-directory: test/e2e
        env:
          TEST_RUN: ${{ matrix.test_run }}
          OTEL_SERVICE_NAME: ${{ matrix.otel_service_name }}
          DT_ENDPOINT: ${{ secrets.DT_ENDPOINT }}
          DT_APPS_ENDPOINT: ${{ secrets.DT_APPS_ENDPOINT }}
          DT_API_TOKEN: ${{ secrets.DT_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          BEDROCK_GUARDRAIL_ID: ${{ secrets.BEDROCK_GUARDRAIL_ID }}
          BEDROCK_GUARDRAIL_VERSION: ${{ secrets.BEDROCK_GUARDRAIL_VERSION }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          MODEL: ${{ matrix.ollama_model != '' && matrix.ollama_model || matrix.model != '' && matrix.model || secrets.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          MOCK_AGENTCORE: ${{ matrix.needs_mock_agentcore && 'true' || '' }}
          OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${{ matrix.needs_mock_agentcore && format('{0}/api/v2/otlp/v1/metrics', secrets.DT_ENDPOINT) || '' }}
        run: |
          set -euo pipefail
          if ! [[ "$TEST_RUN" =~ ^[A-Za-z][A-Za-z0-9_]+$ ]]; then
            echo "Error: TEST_RUN contains invalid characters: $TEST_RUN"; exit 1
          fi
          go test ./... -run "^${TEST_RUN}$" -v -timeout 20m
      - name: Write job summary
        if: always()
        run: |
          for f in test/e2e/reports/*.md; do
            [ -f "$f" ] || continue
            echo "## $(basename "$f" .md)" >> "$GITHUB_STEP_SUMMARY"
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: span-audit-reports-${{ matrix.name }}
          path: test/e2e/reports/
          retention-days: 30
      - name: Uninstall OneAgent
        if: always()
        run: |
          if [ -f /opt/dynatrace/oneagent/agent/uninstall.sh ]; then
            sudo /opt/dynatrace/oneagent/agent/uninstall.sh
          fi

  oneagent-nightly:
    name: E2E / oneagent (nightly consolidated)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.suite == '')
    runs-on: ubuntu-latest
    env:
      DT_ENDPOINT: ${{ secrets.DT_ENDPOINT }}
      DT_APPS_ENDPOINT: ${{ secrets.DT_APPS_ENDPOINT }}
      DT_API_TOKEN: ${{ secrets.DT_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      OPENAI_API_BASE: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
      AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Record job start time
        run: echo "NIGHTLY_START_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: test/e2e/go.mod
          cache: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install uv
        run: pip install -r test/e2e/requirements-tools.txt
      - name: Cache Ollama model
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.ollama/models
          key: ollama-tinyllama
      - name: Set up Ollama
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          timeout 30 bash -c 'until curl -sf http://localhost:11434/api/tags > /dev/null; do sleep 1; done'
          ollama pull tinyllama
      - name: Resolve OneAgent installer version
        id: oneagent-version
        env:
          DT_INSTALLER_TOKEN: ${{ secrets.DT_INSTALLER_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(curl -sS --fail --header "Authorization: Api-Token ${DT_INSTALLER_TOKEN}" "${DT_ENDPOINT}/api/v1/deployment/installer/agent/unix/default/latest/metainfo?arch=x86" | jq -r '.latestAgentVersion')
          test -n "$VERSION" && test "$VERSION" != "null"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Cache OneAgent installer
        id: oneagent-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/oneagent/oneagent.sh
          key: oneagent-installer-${{ steps.oneagent-version.outputs.version }}-x86
      - name: Download Dynatrace OneAgent installer
        if: steps.oneagent-cache.outputs.cache-hit != 'true'
        env:
          DT_INSTALLER_TOKEN: ${{ secrets.DT_INSTALLER_TOKEN }}
          VERSION: ${{ steps.oneagent-version.outputs.version }}
        run: |
          mkdir -p ~/.cache/oneagent
          wget --timeout=60 -O ~/.cache/oneagent/oneagent.sh "${DT_ENDPOINT}/api/v1/deployment/installer/agent/unix/default/version/${VERSION}?arch=x86" --header "Authorization: Api-Token ${DT_INSTALLER_TOKEN}"
      - name: Install Dynatrace OneAgent
        run: sudo sh ~/.cache/oneagent/oneagent.sh
      - name: Wait for OneAgent to settle before first instrumented process launch
        run: sleep 30
      - name: Run oneagent suites
        working-directory: test/e2e
        run: |
          set +e
          run_suite() { TEST_RUN="$1" OTEL_SERVICE_NAME="$2" MODEL="${3:-${AZURE_OPENAI_DEPLOYMENT}}" go test ./... -run "^${1}$" -v -timeout 20m; }
          run_suite TestAWSBedrockOneAgent aws-bedrock/oneagent
          run_suite TestAnthropicOneAgent anthropic/oneagent
          run_suite TestOpenAIOneAgent openai/oneagent
          run_suite TestOllamaOneAgent ollama/oneagent tinyllama
          run_suite TestGroqOneAgent groq/oneagent tinyllama
          run_suite TestCohereOneAgent cohere/oneagent
          run_suite TestHaystackOneAgent haystack/oneagent
          run_suite TestAWSBedrockAgentsOneAgent aws-bedrock-agents/oneagent
          run_suite TestMistralOneAgent mistral/oneagent mistral-small-latest
          run_suite TestLangGraphOneAgent langgraph/oneagent
          run_suite TestAWSStrandsOneAgent aws-strands/oneagent
      - name: Assert entity isolation
        if: always()
        working-directory: test/e2e
        run: go test ./... -run "^TestOneAgentEntityIsolation$" -v -timeout 15m
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: span-audit-reports-oneagent-nightly
          path: test/e2e/reports/
          retention-days: 30
      - name: Uninstall OneAgent
        if: always()
        run: |
          if [ -f /opt/dynatrace/oneagent/agent/uninstall.sh ]; then sudo /opt/dynatrace/oneagent/agent/uninstall.sh; fi

  otelcol:
    name: E2E / ${{ matrix.name }}
    needs: filter
    if: needs.filter.outputs.otelcol-matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.filter.outputs.otelcol-matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: test/e2e/go.mod
          cache: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install uv
        run: pip install -r test/e2e/requirements-tools.txt
      - name: Cache Ollama model
        if: matrix.ollama_model != ''
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.ollama/models
          key: ollama-${{ matrix.ollama_model }}
      - name: Set up Ollama
        if: matrix.ollama_model != ''
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          timeout 30 bash -c 'until curl -sf http://localhost:11434/api/tags > /dev/null; do sleep 1; done'
          ollama pull ${{ matrix.ollama_model }}
      - name: Set up Node.js
        if: ${{ matrix.needs_node || matrix.node_version != '' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node_version || '22' }}
      - name: Set up Google credentials
        if: matrix.needs_google
        run: echo "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}" >> $GITHUB_ENV
      - name: Install Playwright Chromium
        if: matrix.needs_playwright
        run: |
          cd ${{ matrix.app_dir }}
          uv sync --extra demo
          uv run playwright install chromium --with-deps
      - name: Run e2e test
        working-directory: test/e2e
        env:
          TEST_RUN: ${{ matrix.test_run }}
          OTEL_SERVICE_NAME: ${{ matrix.otel_service_name }}
          DT_ENDPOINT: ${{ secrets.DT_ENDPOINT }}
          OTEL_ENDPOINT: ${{ secrets.DT_ENDPOINT }}/api/v2/otlp
          DT_APPS_ENDPOINT: ${{ secrets.DT_APPS_ENDPOINT }}
          DT_API_TOKEN: ${{ secrets.DT_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          BEDROCK_GUARDRAIL_ID: ${{ secrets.BEDROCK_GUARDRAIL_ID }}
          BEDROCK_GUARDRAIL_VERSION: ${{ secrets.BEDROCK_GUARDRAIL_VERSION }}
          OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          MODEL: ${{ matrix.ollama_model != '' && matrix.ollama_model || matrix.model != '' && matrix.model || secrets.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          OPENINFERENCE_ENABLE_GENAI_SEMCONV: ${{ matrix.enable_genai_semconv && 'true' || 'false' }}
          OPENINFERENCE_HIDE_INPUTS: ${{ matrix.enable_genai_semconv && 'true' || 'false' }}
          OPENINFERENCE_HIDE_OUTPUTS: ${{ matrix.enable_genai_semconv && 'true' || 'false' }}
          DT_RUM_SCRIPT: ${{ secrets.DT_RUM_SCRIPT }}
          MAX_RUNS: '1'
        run: |
          set -euo pipefail
          if ! [[ "$TEST_RUN" =~ ^[A-Za-z][A-Za-z0-9_]+$ ]]; then
            echo "Error: TEST_RUN contains invalid characters: $TEST_RUN"; exit 1
          fi
          go test ./... -run "^${TEST_RUN}$" -v -timeout 20m
      - name: Write job summary
        if: always()
        run: |
          for f in test/e2e/reports/*.md; do
            [ -f "$f" ] || continue
            echo "## $(basename "$f" .md)" >> "$GITHUB_STEP_SUMMARY"
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: span-audit-reports-${{ matrix.name }}
          path: test/e2e/reports/
          retention-days: 30

  pr-audit-comment:
    name: Comment span audit on PR
    needs: [oneagent, otelcol]
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Download all audit report artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: span-audit-reports-*
          merge-multiple: true
          path: all-reports/
        continue-on-error: true
      - name: Download nightly baseline reports
        id: baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASELINE_DIR: baseline-reports
        run: bash .github/scripts/download-nightly-baseline.sh
        continue-on-error: true
      - name: Build comment body
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORTS_DIR: all-reports
          BASELINE_DIR: baseline-reports
          BASELINE_RUN_URL: ${{ steps.baseline.outputs.run_url }}
          OUTPUT_FILE: comment.md
        run: bash .github/scripts/pr-audit-comment.sh
      - name: Post or update PR comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: e2e-span-audit
          path: comment.md

  notify:
    name: Notify on regression or recovery
    needs: [oneagent-nightly, otelcol]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Diff audit reports and notify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_ONEAGENT: ${{ needs.oneagent-nightly.result }}
          CURRENT_OTELCOL: ${{ needs.otelcol.result }}
        run: bash .github/scripts/notify-nightly.sh
