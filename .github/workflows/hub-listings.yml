name: 'Hub Listings Snapshot'

on:
  schedule:
    - cron: "0 5 * * 1" # Run at 05:00 UTC on Mondays.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  snapshot:
    permissions:
      contents: write # push the update branch
      pull-requests: write # open the update PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the Hub's public catalog and keeps the "AI and LLM Observability" listings.
      # The snapshot is rewritten only when a listing appears that it doesn't have yet.
      - name: Update snapshot
        id: snapshot
        run: |
          set -euo pipefail
          out=.github/hub-ai-listings.json
          data=$(curl -fsSL https://www.dynatrace.com/hub/ | grep -oE '/hub/public/preloaded-data/[^"]+\.js' | head -1)
          curl -fsSL "https://www.dynatrace.com$data" | sed '1s/^[^=]*= *//; $s/; *$//' | jq '
            (first(.categories | .. | objects | select(.id? == "ai-ml-observability"))) as $c
            | ([$c.page.content[] | .title as $s | (.technologies // [])[] | {key: ., value: ($s | gsub("^\\s+|\\s+$"; ""))}] | reverse | from_entries) as $sec
            | (.technologies | map({key: .slug, value: .}) | from_entries) as $t
            | ([$c.technologies[]?, ($sec | keys[])] | unique)
            | if length == 0 then error("no listings found") else . end
            | map({slug: ., title: $t[.].title, section: ($sec[.] // ""), url: "https://www.dynatrace.com/hub/detail/\(.)/", description: $t[.].description, tags: ($t[.].tags // [])})' > "$RUNNER_TEMP/hub.json"
          new=$(jq -r --slurpfile old <(cat "$out" 2>/dev/null || echo '[]') '[.[].slug] - [$old[0][].slug] | join(", ")' "$RUNNER_TEMP/hub.json")
          if [ -n "$new" ]; then mv "$RUNNER_TEMP/hub.json" "$out"; fi
          echo "new=$new" >> "$GITHUB_OUTPUT"

      - name: Open PR for new listings
        if: steps.snapshot.outputs.new != ''
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: automation/hub-listings-snapshot
          delete-branch: true
          commit-message: "update hub ai listings snapshot"
          title: "Hub AI listings: new listings added"
          body: |
            New listings in the Dynatrace Hub "AI and LLM Observability" category: ${{ steps.snapshot.outputs.new }}

            Check whether each one needs an example in this repo.
          add-paths: .github/hub-ai-listings.json
