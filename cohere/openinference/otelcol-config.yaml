receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # OPENINFERENCE_ENABLE_GENAI_SEMCONV=true (set in main.py) makes
  # CohereInstrumentor emit gen_ai.* attributes natively, so no attribute
  # normalization runs here.
  #
  # Keep only spans that represent LLM calls (gen_ai.request.model set). This
  # filter is used only on the metrics-derivation branch so all spans still go
  # to Distributed Tracing unchanged.
  filter/genai_only:
    error_mode: ignore
    traces:
      span:
        - attributes["gen_ai.request.model"] == nil

  batch:
    send_batch_size: 512
    timeout: 5s

connectors:
  # OpenInference is span-only (no metric instruments), so derive
  # gen_ai.client.operation.duration from LLM span durations.
  span_metrics:
    namespace: gen_ai.client.operation
    aggregation_temporality: AGGREGATION_TEMPORALITY_DELTA
    histogram:
      unit: s
      explicit:
        buckets: [100ms, 250ms, 500ms, 1s, 2s, 5s, 10s, 30s, 60s]
    dimensions:
      - name: gen_ai.request.model
      - name: gen_ai.response.model
      - name: gen_ai.provider.name
      - name: gen_ai.operation.name
    metrics_flush_interval: 15s

  # Re-create gen_ai.client.token.usage from natively-emitted
  # gen_ai.usage.input_tokens / gen_ai.usage.output_tokens.
  signal_to_metrics:
    spans:
      - name: gen_ai.client.token.usage
        description: "Number of tokens used per LLM call, by direction"
        unit: "{token}"
        conditions:
          - attributes["gen_ai.usage.input_tokens"] != nil
        sum:
          value: Int(attributes["gen_ai.usage.input_tokens"])
          monotonic: true
        attributes:
          - key: gen_ai.token.type
            default_value: input
          - key: gen_ai.request.model
          - key: gen_ai.response.model
          - key: gen_ai.provider.name
          - key: gen_ai.operation.name
      - name: gen_ai.client.token.usage
        description: "Number of tokens used per LLM call, by direction"
        unit: "{token}"
        conditions:
          - attributes["gen_ai.usage.output_tokens"] != nil
        sum:
          value: Int(attributes["gen_ai.usage.output_tokens"])
          monotonic: true
        attributes:
          - key: gen_ai.token.type
            default_value: output
          - key: gen_ai.request.model
          - key: gen_ai.response.model
          - key: gen_ai.provider.name
          - key: gen_ai.operation.name

exporters:
  otlp_http/dynatrace:
    endpoint: "${env:DT_ENDPOINT}/api/v2/otlp"
    headers:
      Authorization: "Api-Token ${env:DT_API_TOKEN}"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/dynatrace]
    traces/genai_metrics:
      receivers: [otlp]
      processors: [filter/genai_only, batch]
      exporters: [span_metrics, signal_to_metrics]
    metrics:
      receivers: [otlp, span_metrics, signal_to_metrics]
      exporters: [otlp_http/dynatrace]
    logs:
      receivers: [otlp]
      exporters: [otlp_http/dynatrace]
