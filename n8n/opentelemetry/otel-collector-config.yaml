receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  filelog:
    include: /n8nlogs/*.log
  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-collector'
          scrape_interval: 5s
          metrics_path: /metrics
          static_configs:
            - targets: ['n8n:5678']

processors:
  batch:
    send_batch_size: 500
    timeout: 2s
  cumulativetodelta:
  # --- To associate the logs with the n8n discovered Service in Dyantrace ---
  resource/n8n_logs:
    attributes:
      - action: insert
        key: service.name
        value: ${env:DT_SERVICE_NAME}
  # --- To associate the Metrics with the n8n discovered Service in Dyantrace ---
  resource/n8n_metrics:
    attributes:
      - action: upsert
        key: service.name
        value: ${env:DT_SERVICE_NAME}
  transform/n8n:
    trace_statements:
      - context: span
        statements:
          # --- set workflow.execute parent span as root and type server to make the n8n service discoverable in dynatrace ---
          - set(kind, 2)
            where IsMatch(name, "^workflow\\.execute")
            and resource.attributes["service.name"] == "${env:DT_SERVICE_NAME}"
          - set(attributes["request.is_root_span"], true)
            where IsMatch(name, "^workflow\\.execute")
            and resource.attributes["service.name"] == "${env:DT_SERVICE_NAME}"
          # ---default workflow.execute parent spans rename to workflow.execute/[workflow.id] ---
          - set(name, Concat(["workflow.execute/", attributes["n8n.workflow.id"]], ""))
            where IsMatch(name, "^workflow\\.execute")
            and resource.attributes["service.name"] == "${env:DT_SERVICE_NAME}"
            and attributes["n8n.workflow.id"] != nil
          # --- default node.execute inner spans rename to node.execute/[node.type] ---
          - set(name, Concat(["node.execute/", attributes["n8n.node.type"]], ""))
            where IsMatch(name, "^node\\.execute$")
            and resource.attributes["service.name"] == "${env:DT_SERVICE_NAME}"
            and attributes["n8n.node.type"] != nil
          # --- n8n does not set gen_ai.* on node.execute spans; derive gen_ai.provider.name
          #     and gen_ai.operation.name from n8n.node.type so the AI Observability app
          #     can discover LLM spans. Only the known node types used in this demo are
          #     mapped; extend as needed for other providers. ---
          - set(attributes["gen_ai.provider.name"], "google")
            where IsMatch(name, "^node\\.execute/")
            and resource.attributes["service.name"] == "${env:DT_SERVICE_NAME}"
            and IsMatch(attributes["n8n.node.type"], "GoogleGemini|GooglePalm|VertexAi")
            and attributes["gen_ai.provider.name"] == nil
          - set(attributes["gen_ai.provider.name"], "openai")
            where IsMatch(name, "^node\\.execute/")
            and resource.attributes["service.name"] == "${env:DT_SERVICE_NAME}"
            and IsMatch(attributes["n8n.node.type"], "lmChatOpenAi|lmOpenAi")
            and attributes["gen_ai.provider.name"] == nil
          - set(attributes["gen_ai.provider.name"], "anthropic")
            where IsMatch(name, "^node\\.execute/")
            and resource.attributes["service.name"] == "${env:DT_SERVICE_NAME}"
            and IsMatch(attributes["n8n.node.type"], "lmChatAnthropic")
            and attributes["gen_ai.provider.name"] == nil
          - set(attributes["gen_ai.operation.name"], "chat")
            where IsMatch(name, "^node\\.execute/")
            and resource.attributes["service.name"] == "${env:DT_SERVICE_NAME}"
            and attributes["gen_ai.provider.name"] != nil
            and attributes["gen_ai.operation.name"] == nil
          # --- agent-tracing spans (N8N_AGENTS_TRACING_ENABLED): n8n emits these in
          #     a separate, unlinked trace with no parent span. Promote the .generate /
          #     .stream root spans to kind=SERVER + request.is_root_span so they are
          #     discovered as service entry points in the Dynatrace AI Observability app.
          #     n8n sets gen_ai.request.model as "<provider>/<model>" (e.g.
          #     "google/gemini-2.5-flash") but never sets gen_ai.provider.name or
          #     gen_ai.system. Extract the provider prefix into gen_ai.provider.name
          #     so the AI Observability app entry filter (isNotNull(gen_ai.provider.name))
          #     is satisfied. Fall back to "google" only when model is absent. ---
          - set(kind, 2)
            where IsMatch(name, "\\.(generate|stream)$")
            and resource.attributes["service.name"] == "${env:DT_SERVICE_NAME}"
          - set(attributes["request.is_root_span"], true)
            where IsMatch(name, "\\.(generate|stream)$")
            and resource.attributes["service.name"] == "${env:DT_SERVICE_NAME}"
          - set(attributes["gen_ai.provider.name"], attributes["gen_ai.system"])
            where IsMatch(name, "\\.(generate|stream)$")
            and resource.attributes["service.name"] == "${env:DT_SERVICE_NAME}"
            and attributes["gen_ai.system"] != nil
            and attributes["gen_ai.provider.name"] == nil
          - set(attributes["gen_ai.provider.name"], Split(attributes["gen_ai.request.model"], "/")[0])
            where IsMatch(name, "\\.(generate|stream)$")
            and resource.attributes["service.name"] == "${env:DT_SERVICE_NAME}"
            and attributes["gen_ai.request.model"] != nil
            and IsMatch(attributes["gen_ai.request.model"], ".+/.+")
            and attributes["gen_ai.provider.name"] == nil
          - set(attributes["gen_ai.provider.name"], "google")
            where IsMatch(name, "\\.(generate|stream)$")
            and resource.attributes["service.name"] == "${env:DT_SERVICE_NAME}"
            and attributes["gen_ai.provider.name"] == nil
          # --- map n8n's gen_ai.prompt to gen_ai.input.messages so the AI Observability
          #     app can display the prompt. Controlled by N8N_AGENTS_TRACING_RECORD_INPUTS
          #     on the n8n side; absent when that flag is false. ---
          - set(attributes["gen_ai.input.messages"], attributes["gen_ai.prompt"])
            where IsMatch(name, "\\.(generate|stream)$")
            and resource.attributes["service.name"] == "${env:DT_SERVICE_NAME}"
            and attributes["gen_ai.prompt"] != nil
            and attributes["gen_ai.input.messages"] == nil
          # --- gen_ai.request.model: n8n may not set it (documented as "when known").
          #     Fallback chain:
          #       1. model_id (n8n non-standard parallel attribute, same "<provider>/<model>" format)
          #       2. Strip "<provider>/" or "models/" prefix from whatever value is present.
          #       3. Copy to gen_ai.response.model (n8n never sets it separately). ---
          - set(attributes["gen_ai.request.model"], attributes["model_id"])
            where IsMatch(name, "\\.(generate|stream)$")
            and resource.attributes["service.name"] == "${env:DT_SERVICE_NAME}"
            and attributes["model_id"] != nil
            and attributes["gen_ai.request.model"] == nil
          - set(attributes["gen_ai.request.model"], Split(attributes["gen_ai.request.model"], "/")[1])
            where IsMatch(name, "\\.(generate|stream)$")
            and resource.attributes["service.name"] == "${env:DT_SERVICE_NAME}"
            and attributes["gen_ai.request.model"] != nil
            and IsMatch(attributes["gen_ai.request.model"], ".+/.+")
          - set(attributes["gen_ai.response.model"], attributes["gen_ai.request.model"])
            where IsMatch(name, "\\.(generate|stream)$")
            and resource.attributes["service.name"] == "${env:DT_SERVICE_NAME}"
            and attributes["gen_ai.request.model"] != nil
            and attributes["gen_ai.response.model"] == nil

  # --- Filter processors used to route specific span types to their spanmetrics connector ---
  filter/agent_spans:
    error_mode: ignore
    traces:
      span:
        - 'not IsMatch(name, ".*\\.(generate|stream)$")'
  filter/tool_spans:
    error_mode: ignore
    traces:
      span:
        - 'not IsMatch(name, "^execute_tool")'
  filter/workflow_spans:
    error_mode: ignore
    traces:
      span:
        - 'not IsMatch(name, "^workflow\\.execute")'


connectors:
  # Each connector instance produces {namespace}.duration from its filtered spans.
  # gen_ai.client.token.usage is not produced: n8n does not emit token counts.
  spanmetrics/invoke_agent:
    namespace: gen_ai.invoke_agent
    dimensions:
      - name: gen_ai.provider.name
      - name: gen_ai.request.model
      - name: gen_ai.operation.name
    metrics_flush_interval: 15s
    histogram:
      explicit:
        buckets: [0.1, 0.25, 0.5, 1, 2.5, 5, 10, 30, 60]
  spanmetrics/client_operation:
    namespace: gen_ai.client.operation
    dimensions:
      - name: gen_ai.provider.name
      - name: gen_ai.request.model
      - name: gen_ai.operation.name
    metrics_flush_interval: 15s
    histogram:
      explicit:
        buckets: [0.1, 0.25, 0.5, 1, 2.5, 5, 10, 30, 60]
  spanmetrics/execute_tool:
    namespace: gen_ai.execute_tool
    dimensions:
      - name: gen_ai.tool.name
      - name: gen_ai.agent.name
    metrics_flush_interval: 15s
    histogram:
      explicit:
        buckets: [0.05, 0.1, 0.25, 0.5, 1, 2.5, 5]
  spanmetrics/invoke_workflow:
    namespace: gen_ai.invoke_workflow
    dimensions:
      - name: n8n.workflow.id
    metrics_flush_interval: 15s
    histogram:
      explicit:
        buckets: [0.1, 0.25, 0.5, 1, 2.5, 5, 10, 30, 60]


exporters:
  debug:
    verbosity: detailed

  otlphttp/dynatrace:
    endpoint: "${env:DT_ENVIRONMENT_URL}/api/v2/otlp"
    headers: 
      Authorization: "Api-Token ${env:DT_API_TOKEN}"
service:
  pipelines:
    logs:
      receivers: [filelog]
      processors: [resource/n8n_logs,batch]
      exporters: [otlphttp/dynatrace]
    # Main traces pipeline: full transform + export to Dynatrace
    traces:
      receivers: [otlp]
      processors: [transform/n8n]
      exporters: [debug, otlphttp/dynatrace]
    # Per-span-type pipelines feeding spanmetrics connectors.
    # Each receives from otlp independently (data is cloned), applies the same
    # transform, then drops non-matching spans before the connector.
    traces/agent_metrics:
      receivers: [otlp]
      processors: [transform/n8n, filter/agent_spans]
      exporters: [spanmetrics/invoke_agent, spanmetrics/client_operation]
    traces/tool_metrics:
      receivers: [otlp]
      processors: [transform/n8n, filter/tool_spans]
      exporters: [spanmetrics/execute_tool]
    traces/workflow_metrics:
      receivers: [otlp]
      processors: [transform/n8n, filter/workflow_spans]
      exporters: [spanmetrics/invoke_workflow]
    metrics:
      receivers: [prometheus, spanmetrics/invoke_agent, spanmetrics/client_operation, spanmetrics/execute_tool, spanmetrics/invoke_workflow]
      processors: [resource/n8n_metrics,cumulativetodelta,batch]
      exporters: [debug, otlphttp/dynatrace]
