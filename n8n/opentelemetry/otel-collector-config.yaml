receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  filelog:
    include: /n8nlogs/*.log
  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-collector'
          scrape_interval: 5s
          metrics_path: /metrics
          static_configs:
            - targets: ['n8n:5678']

processors:
  batch:
    send_batch_size: 500
    timeout: 2s
  cumulativetodelta:
  # --- To associate the logs with the n8n discovered Service in Dyantrace ---
  resource/n8n_logs:
    attributes:
      - action: insert
        key: service.name
        value: ${env:DT_SERVICE_NAME}
  # --- To associate the Metrics with the n8n discovered Service in Dyantrace ---
  resource/n8n_metrics:
    attributes:
      - action: upsert
        key: service.name
        value: ${env:DT_SERVICE_NAME}
  transform/n8n:
    trace_statements:
      - context: span
        statements:
          # --- set workflow.execute parent span as root and type server to make the n8n service discoverable in dynatrace ---
          - set(kind, 2)
            where IsMatch(name, "^workflow\\.execute")
            and resource.attributes["service.name"] == "${env:DT_SERVICE_NAME}"
          - set(attributes["request.is_root_span"], true)
            where IsMatch(name, "^workflow\\.execute")
            and resource.attributes["service.name"] == "${env:DT_SERVICE_NAME}"
          # ---default workflow.execute parent spans rename to workflow.execute/[workflow.id] ---
          - set(name, Concat(["workflow.execute/", attributes["n8n.workflow.id"]], ""))
            where IsMatch(name, "^workflow\\.execute")
            and resource.attributes["service.name"] == "${env:DT_SERVICE_NAME}"
            and attributes["n8n.workflow.id"] != nil
          # --- default node.execute inner spans rename to node.execute/[node.type] ---
          - set(name, Concat(["node.execute/", attributes["n8n.node.type"]], ""))
            where IsMatch(name, "^node\\.execute$")
            and resource.attributes["service.name"] == "${env:DT_SERVICE_NAME}"
            and attributes["n8n.node.type"] != nil
          # --- n8n does not set gen_ai.* on node.execute spans; derive gen_ai.provider.name
          #     and gen_ai.operation.name from n8n.node.type so the AI Observability app
          #     can discover LLM spans. Only the known node types used in this demo are
          #     mapped; extend as needed for other providers. ---
          - set(attributes["gen_ai.provider.name"], "google")
            where IsMatch(name, "^node\\.execute/")
            and resource.attributes["service.name"] == "${env:DT_SERVICE_NAME}"
            and IsMatch(attributes["n8n.node.type"], "GoogleGemini|GooglePalm|VertexAi")
            and attributes["gen_ai.provider.name"] == nil
          - set(attributes["gen_ai.provider.name"], "openai")
            where IsMatch(name, "^node\\.execute/")
            and resource.attributes["service.name"] == "${env:DT_SERVICE_NAME}"
            and IsMatch(attributes["n8n.node.type"], "lmChatOpenAi|lmOpenAi")
            and attributes["gen_ai.provider.name"] == nil
          - set(attributes["gen_ai.provider.name"], "anthropic")
            where IsMatch(name, "^node\\.execute/")
            and resource.attributes["service.name"] == "${env:DT_SERVICE_NAME}"
            and IsMatch(attributes["n8n.node.type"], "lmChatAnthropic")
            and attributes["gen_ai.provider.name"] == nil
          - set(attributes["gen_ai.operation.name"], "chat")
            where IsMatch(name, "^node\\.execute/")
            and resource.attributes["service.name"] == "${env:DT_SERVICE_NAME}"
            and attributes["gen_ai.provider.name"] != nil
            and attributes["gen_ai.operation.name"] == nil
          # --- agent-tracing spans (N8N_AGENTS_TRACING_ENABLED): n8n emits these in
          #     a separate, unlinked trace with no parent span. Promote the .generate /
          #     .stream root spans to kind=SERVER + request.is_root_span so they are
          #     discovered as service entry points in the Dynatrace AI Observability app.
          #     Synthesize gen_ai.provider.name from gen_ai.system (if present) or fall
          #     back to "google" for the Gemini demo workflow. ---
          - set(kind, 2)
            where IsMatch(name, "\\.(generate|stream)$")
            and resource.attributes["service.name"] == "${env:DT_SERVICE_NAME}"
          - set(attributes["request.is_root_span"], true)
            where IsMatch(name, "\\.(generate|stream)$")
            and resource.attributes["service.name"] == "${env:DT_SERVICE_NAME}"
          - set(attributes["gen_ai.operation.name"], "chat")
            where IsMatch(name, "\\.(generate|stream)$")
            and resource.attributes["service.name"] == "${env:DT_SERVICE_NAME}"
            and attributes["gen_ai.operation.name"] == nil
          - set(attributes["gen_ai.provider.name"], attributes["gen_ai.system"])
            where IsMatch(name, "\\.(generate|stream)$")
            and resource.attributes["service.name"] == "${env:DT_SERVICE_NAME}"
            and attributes["gen_ai.system"] != nil
            and attributes["gen_ai.provider.name"] == nil
          - set(attributes["gen_ai.provider.name"], "google")
            where IsMatch(name, "\\.(generate|stream)$")
            and resource.attributes["service.name"] == "${env:DT_SERVICE_NAME}"
            and attributes["gen_ai.provider.name"] == nil


exporters:
  debug:
    verbosity: detailed

  otlphttp/dynatrace:
    endpoint: "${env:DT_ENVIRONMENT_URL}/api/v2/otlp"
    headers: 
      Authorization: "Api-Token ${env:DT_API_TOKEN}"
service:
  pipelines:
    logs:
      receivers: [filelog]
      processors: [resource/n8n_logs,batch]
      exporters: [otlphttp/dynatrace]
    metrics:
      receivers: [prometheus]
      processors: [resource/n8n_metrics,cumulativetodelta,batch]
      exporters: [debug, otlphttp/dynatrace]
    traces:
      receivers: [otlp]
      processors: [transform/n8n]
      exporters: [debug, otlphttp/dynatrace]
