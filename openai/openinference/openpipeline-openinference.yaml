---
# OpenPipeline configuration for OpenInference spans.
#
# The app enables OPENINFERENCE_ENABLE_GENAI_SEMCONV=true, so OpenInference
# emits gen_ai.* attributes natively. This pipeline does not normalize
# OpenInference llm.* fields; it only derives metrics (and extracts Azure prompt
# filter results when present).

customId: "openinference-ai-spans"
displayName: "OpenInference AI Observability - Spans"

processing:
  processors:
    - id: "openinference-output-prompt-results"
      enabled: true
      matcher: "isNotNull(output.value)"
      type: "dql"
      description: "Extract Azure prompt filter results from output.value JSON"
      dql:
        script: |
          parse output.value, "JSON:output_value"
          | fieldsAdd gen_ai.prompt.prompt_filter_results = toString(output_value[prompt_filter_results])
          | fieldsRemove output_value

    - id: "openinference-duration-seconds"
      enabled: true
      matcher: "isNotNull(`gen_ai.usage.input_tokens`) OR isNotNull(`gen_ai.usage.output_tokens`)"
      type: "dql"
      description: "Compute model-call duration in seconds"
      dql:
        script: |
          fieldsAdd duration_seconds = toDouble(duration) / 1000000000.0

metricExtraction:
  processors:
    - id: "openinference-operation-duration-metric"
      enabled: true
      matcher: "isNotNull(duration_seconds)"
      type: "samplingAwareHistogramMetric"
      description: "Extract gen_ai.client.operation.duration from OpenInference spans"
      samplingAwareHistogramMetric:
        metricKey: "gen_ai.client.operation.duration"
        measurement: "field"
        field: "duration_seconds"
        aggregation: "enabled"
        sampling: "enabled"
        dimensions:
          - extractionType: "field"
            sourceFieldName: "service.name"
          - extractionType: "field"
            sourceFieldName: "gen_ai.operation.name"
          - extractionType: "field"
            sourceFieldName: "gen_ai.provider.name"
          - extractionType: "field"
            sourceFieldName: "gen_ai.request.model"
          - extractionType: "field"
            sourceFieldName: "gen_ai.response.model"

    - id: "openinference-token-usage-input-metric"
      enabled: true
      matcher: "isNotNull(`gen_ai.usage.input_tokens`)"
      type: "samplingAwareValueMetric"
      description: "Extract gen_ai.client.token.usage (input tokens)"
      samplingAwareValueMetric:
        metricKey: "gen_ai.client.token.usage"
        measurement: "field"
        field: "gen_ai.usage.input_tokens"
        aggregation: "enabled"
        sampling: "enabled"
        dimensions:
          - extractionType: "constant"
            constantFieldName: "gen_ai.token.type"
            constantValue: "input"
          - extractionType: "field"
            sourceFieldName: "service.name"
          - extractionType: "field"
            sourceFieldName: "gen_ai.operation.name"
          - extractionType: "field"
            sourceFieldName: "gen_ai.provider.name"
          - extractionType: "field"
            sourceFieldName: "gen_ai.request.model"
          - extractionType: "field"
            sourceFieldName: "gen_ai.response.model"

    - id: "openinference-token-usage-output-metric"
      enabled: true
      matcher: "isNotNull(`gen_ai.usage.output_tokens`)"
      type: "samplingAwareValueMetric"
      description: "Extract gen_ai.client.token.usage (output tokens)"
      samplingAwareValueMetric:
        metricKey: "gen_ai.client.token.usage"
        measurement: "field"
        field: "gen_ai.usage.output_tokens"
        aggregation: "enabled"
        sampling: "enabled"
        dimensions:
          - extractionType: "constant"
            constantFieldName: "gen_ai.token.type"
            constantValue: "output"
          - extractionType: "field"
            sourceFieldName: "service.name"
          - extractionType: "field"
            sourceFieldName: "gen_ai.operation.name"
          - extractionType: "field"
            sourceFieldName: "gen_ai.provider.name"
          - extractionType: "field"
            sourceFieldName: "gen_ai.request.model"
          - extractionType: "field"
            sourceFieldName: "gen_ai.response.model"
