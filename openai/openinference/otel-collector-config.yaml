receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Extract Azure OpenAI content-filter results embedded in output.value so they
  # are queryable in DQL without reparsing the full output payload.
  transform/output_prompt_results:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(attributes["temp.output_value"], ParseJSON(attributes["output.value"])) where attributes["output.value"] != nil
          - set(attributes["gen_ai.prompt.prompt_filter_results"], String(attributes["temp.output_value"]["prompt_filter_results"])) where attributes["temp.output_value"]["prompt_filter_results"] != nil
          - delete_key(attributes, "temp.output_value")

  # Keep only spans that represent model calls for the metrics branch. With
  # OPENINFERENCE_ENABLE_GENAI_SEMCONV=true, OpenInference emits gen_ai.*
  # attributes natively, so no llm.* -> gen_ai.* normalization is required.
  filter/genai_only:
    error_mode: ignore
    traces:
      span:
        - attributes["gen_ai.request.model"] == nil

connectors:
  # Derive gen_ai.client.operation.duration from span durations.
  span_metrics:
    namespace: gen_ai.client.operation
    aggregation_temporality: AGGREGATION_TEMPORALITY_DELTA
    histogram:
      unit: s
      explicit:
        buckets: [100ms, 250ms, 500ms, 1s, 2s, 5s, 10s, 30s, 60s]
    dimensions:
      - name: gen_ai.request.model
      - name: gen_ai.response.model
      - name: gen_ai.provider.name
      - name: gen_ai.operation.name
    metrics_flush_interval: 15s

  # Derive gen_ai.client.token.usage from native gen_ai.usage.* attributes.
  signal_to_metrics:
    spans:
      - name: gen_ai.client.token.usage
        description: "Number of tokens used per model call, by direction"
        unit: "{token}"
        conditions:
          - attributes["gen_ai.usage.input_tokens"] != nil
        sum:
          value: Int(attributes["gen_ai.usage.input_tokens"])
          monotonic: true
        attributes:
          - key: gen_ai.token.type
            default_value: input
          - key: gen_ai.request.model
          - key: gen_ai.response.model
          - key: gen_ai.provider.name
          - key: gen_ai.operation.name
      - name: gen_ai.client.token.usage
        description: "Number of tokens used per model call, by direction"
        unit: "{token}"
        conditions:
          - attributes["gen_ai.usage.output_tokens"] != nil
        sum:
          value: Int(attributes["gen_ai.usage.output_tokens"])
          monotonic: true
        attributes:
          - key: gen_ai.token.type
            default_value: output
          - key: gen_ai.request.model
          - key: gen_ai.response.model
          - key: gen_ai.provider.name
          - key: gen_ai.operation.name

exporters:
  debug:
    verbosity: detailed
  otlp_http/dynatrace:
    endpoint: ${env:DT_ENDPOINT}/api/v2/otlp
    headers:
      Authorization: "Api-Token ${env:DT_API_TOKEN}"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/output_prompt_results]
      exporters: [debug, otlp_http/dynatrace]
    traces/genai_metrics:
      receivers: [otlp]
      processors: [filter/genai_only]
      exporters: [span_metrics, signal_to_metrics]
    metrics:
      receivers: [span_metrics, signal_to_metrics]
      exporters: [otlp_http/dynatrace]
