[project]
name = "dt-evals-fixtures-opentelemetry-demo"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=0.3.0",
    "traceloop-sdk==0.62.1",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
