[project]
name = "dt-evals-fixtures-opentelemetry-demo"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "langchain-core==1.6.12",
    "traceloop-sdk==0.62.4",
    "fastapi==0.156.4",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    # build_fixtures.py only — sources real dataset rows. Not needed at runtime
    # (fixtures.json is committed), so kept out of the app's dependencies.
    "datasets==5.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
