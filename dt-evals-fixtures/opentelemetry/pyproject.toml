[project]
name = "dt-evals-fixtures-opentelemetry-demo"
version = "0.1.0"
requires-python = "==3.15.0"
dependencies = [
    "langchain-core==1.5.3",
    "traceloop-sdk==0.62.4",
    "fastapi==0.141.1",
    "uvicorn==0.52.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    # build_fixtures.py only — sources real dataset rows. Not needed at runtime
    # (fixtures.json is committed), so kept out of the app's dependencies.
    "datasets==5.0.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
