[project]
name = "dt-evals-fixtures-opentelemetry-demo"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "langchain-core==1.8.0",
    "traceloop-sdk==0.63.0",
    "fastapi==0.162.7",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    # build_fixtures.py only — sources real dataset rows. Not needed at runtime
    # (fixtures.json is committed), so kept out of the app's dependencies.
    "datasets==5.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
