[project]
name = "ogx-opentelemetry-demo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ogx[client]==1.4.0",
    "ollama>=0.3.0",
    # provider deps for the Responses API (ogx stack list-deps config.yaml)
    "sqlite-vec",
    "aiosqlite",
    "pillow>=12.2.0",
    "fonttools>=4.60.2",
    "matplotlib",
    "pandas",
    "pypdf>=6.13.0",
    "chardet",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "opentelemetry-distro>=0.60b1",
    "opentelemetry-exporter-otlp-proto-http>=1.39.0",
    "opentelemetry-instrumentation-openai-v2==2.4b0",
    # openai-v2 2.4b0 imports util.genai.instruments, which util-genai 1.2b0 removed
    "opentelemetry-util-genai==1.1b0",
]
