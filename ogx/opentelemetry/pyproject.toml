[project]
name = "ogx-opentelemetry-demo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ogx[client]==1.5.0",
    "ollama==0.6.3",
    # provider deps for the Responses API (ogx stack list-deps config.yaml)
    "sqlite-vec",
    "aiosqlite",
    "pillow==13.0.0",
    "fonttools==4.68.0",
    "matplotlib",
    "pandas",
    "pypdf==7.0.1",
    "chardet",
    "fastapi==0.162.5",
    "uvicorn==0.54.0",
    "opentelemetry-distro==0.66b2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "opentelemetry-instrumentation-fastapi==0.66b2",
    "opentelemetry-instrumentation-openai-v2==2.4b0",
    # openai-v2 2.4b0 imports util.genai.instruments, which util-genai 1.2b0 removed
    "opentelemetry-util-genai==1.1b0",
]
